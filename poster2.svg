<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <defs>
    <linearGradient id="warmSunset" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1F1528"/>
      <stop offset="45%" stop-color="#581C87"/>
      <stop offset="75%" stop-color="#9D174D"/>
      <stop offset="95%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <radialGradient id="sunDrama" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#F97316" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sky -->
  <rect width="400" height="600" fill="url(#warmSunset)"/>
  <circle cx="200" cy="360" r="130" fill="url(#sunDrama)"/>

  <!-- Hill & Tree Silhouettes -->
  <path d="M 0,470 Q 150,420 400,480 L 400,600 L 0,600 Z" fill="#180C24"/>
  <path d="M -20,510 Q 200,470 420,530 L 420,600 L -20,600 Z" fill="#0A0410"/>

  <!-- Family Silhouette (Mother and Children walking together) -->
  <g transform="translate(140, 410) scale(0.9)" fill="#0A0410">
    <!-- Mother -->
    <ellipse cx="60" cy="18" rx="6" ry="7"/>
    <path d="M 52,26 Q 60,24 68,26 L 73,75 L 47,75 Z"/>
    <!-- Child 1 (holding hand) -->
    <ellipse cx="38" cy="38" rx="4.5" ry="5"/>
    <path d="M 32,44 L 44,44 L 46,75 L 30,75 Z"/>
    <line x1="44" y1="48" x2="52" y2="46" stroke="#0A0410" stroke-width="2.5"/>
    <!-- Child 2 -->
    <ellipse cx="82" cy="34" rx="5" ry="5.5"/>
    <path d="M 76,40 L 88,40 L 91,75 L 73,75 Z"/>
    <line x1="68" y1="46" x2="76" y2="44" stroke="#0A0410" stroke-width="2.5"/>
  </g>

  <!-- Typography -->
  <g text-anchor="middle">
    <text x="200" y="110" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#FDE047" letter-spacing="4">SEBUAH KISAH KELUARGA &amp; CINTA</text>
    <text x="200" y="170" font-family="'Space Grotesk', sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" letter-spacing="2">BILA ESOK</text>
    <text x="200" y="215" font-family="'Space Grotesk', sans-serif" font-size="32" font-weight="900" fill="#FDE047" letter-spacing="2">IBU TIADA</text>
    <text x="200" y="248" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#FCD34D" letter-spacing="3">SEBELUM SEMUANYA MENJADI KENANGAN</text>

    <!-- Seed & Info -->
    <rect x="140" y="270" width="120" height="22" rx="4" fill="#000" opacity="0.6" stroke="#F59E0B" stroke-width="1"/>
    <text x="200" y="285" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#FDE68A">SEED: FLM-2902</text>

    <!-- Specs Footer -->
    <text x="200" y="555" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#F8FAFC" letter-spacing="1">DRAMA • KELUARGA • SEMUA UMUR (SU)</text>
    <text x="200" y="575" font-family="sans-serif" font-size="10" fill="#E2E8F0" letter-spacing="1">STUDIO 3 REGULER • DIGITAL 2D • CINEDECIDE</text>
  </g>
</svg>

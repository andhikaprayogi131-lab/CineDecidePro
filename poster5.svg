<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <defs>
    <linearGradient id="clinicNight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050C14"/>
      <stop offset="50%" stop-color="#0E1D2D"/>
      <stop offset="85%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="corridorGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#0284C7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#050C14" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sky Canvas -->
  <rect width="400" height="600" fill="url(#clinicNight)"/>
  <circle cx="200" cy="270" r="150" fill="url(#corridorGlow)"/>

  <!-- Hospital Hallway Perspective (Vanishing point at 200, 270) -->
  <!-- Ceiling -->
  <polygon points="0,0 400,0 260,240 140,240" fill="#081422"/>
  <!-- Floor -->
  <polygon points="0,600 400,600 260,300 140,300" fill="#020810"/>
  <!-- Left Wall -->
  <polygon points="0,0 140,240 140,300 0,600" fill="#0A1828"/>
  <!-- Right Wall -->
  <polygon points="400,0 260,240 260,300 400,600" fill="#0D2035"/>

  <!-- Red Cross Hospital Emblem Glow at Doorway -->
  <g transform="translate(185, 252)">
    <rect x="11" y="0" width="8" height="30" fill="#EF4444" rx="2"/>
    <rect x="0" y="11" width="30" height="8" fill="#EF4444" rx="2"/>
  </g>

  <!-- Door Frames on Corridor -->
  <polygon points="30,120 70,165 70,440 30,500" fill="#050F1A" stroke="#1E293B" stroke-width="1.5"/>
  <polygon points="370,120 330,165 330,440 370,500" fill="#071524" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Typography -->
  <g text-anchor="middle">
    <text x="200" y="90" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#F87171" letter-spacing="4">BERDASARKAN KISAH VIRAL POLIKLINIK</text>
    <text x="200" y="145" font-family="'Space Grotesk', sans-serif" font-size="38" font-weight="900" fill="#FFFFFF" letter-spacing="3">LEMBAYUNG</text>
    <text x="200" y="175" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#F87171" letter-spacing="3">POLIKLINIK ANGKER</text>

    <!-- Seed & Info -->
    <rect x="140" y="475" width="120" height="22" rx="4" fill="#000" stroke="#EF4444" stroke-width="1"/>
    <text x="200" y="490" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#FCA5A5">SEED: FLM-2905</text>

    <!-- Specs Footer -->
    <text x="200" y="555" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#F8FAFC" letter-spacing="1">HOROR • MISTERI • DEWASA (D17+)</text>
    <text x="200" y="575" font-family="sans-serif" font-size="10" fill="#94A3B8" letter-spacing="1">STUDIO 2 IMAX • IMAX LASER 2D • CINEDECIDE</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="blueprintBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#blueprintBg)" stroke="#334155" stroke-width="2"/>
  <!-- Blueprint Grid lines -->
  <line x1="0" y1="50" x2="600" y2="50" stroke="#1E293B" stroke-dasharray="4"/>
  <line x1="0" y1="100" x2="600" y2="100" stroke="#1E293B" stroke-dasharray="4"/>
  <line x1="0" y1="150" x2="600" y2="150" stroke="#1E293B" stroke-dasharray="4"/>
  <line x1="0" y1="200" x2="600" y2="200" stroke="#1E293B" stroke-dasharray="4"/>
  <line x1="0" y1="250" x2="600" y2="250" stroke="#1E293B" stroke-dasharray="4"/>
  <line x1="0" y1="300" x2="600" y2="300" stroke="#1E293B" stroke-dasharray="4"/>
  <line x1="0" y1="350" x2="600" y2="350" stroke="#1E293B" stroke-dasharray="4"/>

  <!-- Cinema Curved Screen -->
  <path d="M 120,60 Q 300,30 480,60" fill="none" stroke="#38BDF8" stroke-width="8" stroke-linecap="round"/>
  <text x="300" y="80" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" fill="#38BDF8" text-anchor="middle" letter-spacing="3">LAYAR UTAMA STUDIO 1 (PREMIERE STD-29A)</text>

  <!-- Seats Representation (Rows A to F, 8 columns with center aisle) -->
  <!-- We draw mini blocks for seats -->
  <g fill="#334155" stroke="#475569" stroke-width="1">
    <!-- Row A -->
    <rect x="150" y="120" width="22" height="22" rx="3"/><rect x="180" y="120" width="22" height="22" rx="3"/><rect x="210" y="120" width="22" height="22" rx="3"/><rect x="240" y="120" width="22" height="22" rx="3"/>
    <rect x="338" y="120" width="22" height="22" rx="3"/><rect x="368" y="120" width="22" height="22" rx="3"/><rect x="398" y="120" width="22" height="22" rx="3"/><rect x="428" y="120" width="22" height="22" rx="3"/>
    <!-- Row B -->
    <rect x="150" y="155" width="22" height="22" rx="3"/><rect x="180" y="155" width="22" height="22" rx="3"/><rect x="210" y="155" width="22" height="22" rx="3"/><rect x="240" y="155" width="22" height="22" rx="3"/>
    <rect x="338" y="155" width="22" height="22" rx="3"/><rect x="368" y="155" width="22" height="22" rx="3"/><rect x="398" y="155" width="22" height="22" rx="3"/><rect x="428" y="155" width="22" height="22" rx="3"/>
    <!-- Row C -->
    <rect x="150" y="190" width="22" height="22" rx="3"/><rect x="180" y="190" width="22" height="22" rx="3"/><rect x="210" y="190" width="22" height="22" rx="3"/><rect x="240" y="190" width="22" height="22" rx="3"/>
    <rect x="338" y="190" width="22" height="22" rx="3"/><rect x="368" y="190" width="22" height="22" rx="3"/><rect x="398" y="190" width="22" height="22" rx="3"/><rect x="428" y="190" width="22" height="22" rx="3"/>
    <!-- Row D (VIP Center highlighted) -->
    <rect x="150" y="225" width="22" height="22" rx="3" fill="#F59E0B"/><rect x="180" y="225" width="22" height="22" rx="3" fill="#F59E0B"/><rect x="210" y="225" width="22" height="22" rx="3" fill="#F59E0B"/><rect x="240" y="225" width="22" height="22" rx="3" fill="#F59E0B"/>
    <rect x="338" y="225" width="22" height="22" rx="3" fill="#F59E0B"/><rect x="368" y="225" width="22" height="22" rx="3" fill="#F59E0B"/><rect x="398" y="225" width="22" height="22" rx="3" fill="#F59E0B"/><rect x="428" y="225" width="22" height="22" rx="3" fill="#F59E0B"/>
    <!-- Row E -->
    <rect x="150" y="260" width="22" height="22" rx="3"/><rect x="180" y="260" width="22" height="22" rx="3"/><rect x="210" y="260" width="22" height="22" rx="3"/><rect x="240" y="260" width="22" height="22" rx="3"/>
    <rect x="338" y="260" width="22" height="22" rx="3"/><rect x="368" y="260" width="22" height="22" rx="3"/><rect x="398" y="260" width="22" height="22" rx="3"/><rect x="428" y="260" width="22" height="22" rx="3"/>
    <!-- Row F -->
    <rect x="150" y="295" width="22" height="22" rx="3"/><rect x="180" y="295" width="22" height="22" rx="3"/><rect x="210" y="295" width="22" height="22" rx="3"/><rect x="240" y="295" width="22" height="22" rx="3"/>
    <rect x="338" y="295" width="22" height="22" rx="3"/><rect x="368" y="295" width="22" height="22" rx="3"/><rect x="398" y="295" width="22" height="22" rx="3"/><rect x="428" y="295" width="22" height="22" rx="3"/>
  </g>

  <!-- Row Labels -->
  <text x="130" y="136" font-family="sans-serif" font-size="12" font-weight="700" fill="#94A3B8">A</text>
  <text x="130" y="171" font-family="sans-serif" font-size="12" font-weight="700" fill="#94A3B8">B</text>
  <text x="130" y="206" font-family="sans-serif" font-size="12" font-weight="700" fill="#94A3B8">C</text>
  <text x="130" y="241" font-family="sans-serif" font-size="12" font-weight="700" fill="#F59E0B">D</text>
  <text x="130" y="276" font-family="sans-serif" font-size="12" font-weight="700" fill="#94A3B8">E</text>
  <text x="130" y="311" font-family="sans-serif" font-size="12" font-weight="700" fill="#94A3B8">F</text>

  <!-- Center Aisle Text -->
  <text x="290" y="225" font-family="sans-serif" font-size="10" fill="#64748B" transform="rotate(-90 290 225)" letter-spacing="2">LORONG JALAN TENGAH</text>

  <!-- Bottom Legend -->
  <rect x="140" y="340" width="16" height="16" rx="3" fill="#F59E0B"/>
  <text x="165" y="353" font-family="sans-serif" font-size="11" fill="#E2E8F0">Baris Emas (Sweet Spot)</text>
  <rect x="320" y="340" width="16" height="16" rx="3" fill="#334155"/>
  <text x="345" y="353" font-family="sans-serif" font-size="11" fill="#E2E8F0">Kapasitas 48 Kursi (Seed 29)</text>
</svg>

